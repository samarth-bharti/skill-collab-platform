server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:skillcollab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: 8f533a3cf7de4b88afec18ef88ceff638cb3dcf76bbf5bb0fc0e7bcd4ab491d7
    expiration-minutes: 1440
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
